    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">

        <i class="fa-solid fa-book-open-reader"></i>

        <span>Smart Library</span>

    </div>

    <ul>

        <li>
            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li>
            <a href="books.html">
                <i class="fa-solid fa-book"></i>
                <span>Books</span>
            </a>
        </li>

        <li>
            <a href="students.html">
                <i class="fa-solid fa-user-graduate"></i>
                <span>Students</span>
            </a>
        </li>

        <li class="active">
            <a href="staff-management.html">
                <i class="fa-solid fa-user-tie"></i>
                <span>Staff Management</span>
            </a>
        </li>

        <li>
            <a href="issue.html">
                <i class="fa-solid fa-book-open"></i>
                <span>Issue Book</span>
            </a>
        </li>

        <li>
            <a href="return.html">
                <i class="fa-solid fa-arrow-rotate-left"></i>
                <span>Return Book</span>
            </a>
        </li>

        <li>
            <a href="login.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </li>

    </ul>

</div>


<!-- ================= MAIN CONTENT ================= -->

<div class="main-content">

    <!-- HEADER -->

    <div class="page-header">

        <div>

            <h1>
                <i class="fa-solid fa-user-tie"></i>
                Staff Management
            </h1>

            <p>Manage library staff information</p>

        </div>

    </div>


    <!-- ================= ADD STAFF CARD ================= -->

    <div class="staff-card">

        <h2>
            Add Staff
        </h2>

        <div class="form-grid">

            <div class="input-group">

                <label>Staff Name</label>

                <input
                    type="text"
                    id="staffName"
                    placeholder="Enter staff name">

            </div>


            

            <div class="input-group">

                <label>Mobile Number</label>

                <input
                    type="text"
                    id="staffMobile"
                    placeholder="Enter mobile number">

            </div>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="staffEmail"
                    placeholder="Enter email">

            </div>


            <div class="input-group">

    <label>Role / Department</label>

    <input
        type="text"
        id="staffRole"
        placeholder="Enter role or department">

</div>

        </div>


        <button class="add-staff-btn" onclick="addStaff()">

            <i class="fa-solid fa-plus"></i>

            Add Staff

        </button>

    </div>


    <!-- ================= STAFF LIST ================= -->

    <div class="staff-card" style="width: 100%; max-width: 1200px;">

        <div class="list-header">

            <div>

               <h2>
    
</h2>
            </div>


            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchStaff"
                    placeholder="Search staff..."
                    onkeyup="searchStaff()">

            </div>

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        
                        <th>Mobile</th>

                        <th>Email</th>

                        <th>Role</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="staffTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>


// ========================================
// STAFF MANAGEMENT JAVASCRIPT
// ========================================


// ADD STAFF

function addStaff() {

    let name =
        document.getElementById("staffName").value.trim();

        let mobile =
        document.getElementById("staffMobile").value.trim();

    let email =
        document.getElementById("staffEmail").value.trim();

    let role =
        document.getElementById("staffRole").value.trim();


    // Validation

    if (name === "" ||
                mobile === "") {

        alert(
            "Please fill Staff Name, Mobile Number."
        );

        return;

    }


    // Get existing staff

    let staffList =
        JSON.parse(
            localStorage.getItem("smartLibraryStaff")
        ) || [];


    // Add staff

    staffList.push({

        name: name,

                mobile: mobile,

        email: email,

        role: role,

        status: "Active"

    });


    // Save

    localStorage.setItem(
        "smartLibraryStaff",
        JSON.stringify(staffList)
    );


    alert("Staff Added Successfully!");


    // Clear form

    document.getElementById("staffName").value = "";

   
    document.getElementById("staffMobile").value = "";

    document.getElementById("staffEmail").value = "";

    document.getElementById("staffRole").value = "";


    // Reload table

    loadStaff();

}


// ========================================
// LOAD STAFF
// ========================================

function loadStaff() {

    let tableBody =
        document.getElementById("staffTableBody");


    let staffList =
        JSON.parse(
            localStorage.getItem("smartLibraryStaff")
        ) || [];


    tableBody.innerHTML = "";


    if (staffList.length === 0) {

        tableBody.innerHTML = `

            <tr>

                <td colspan="8" class="no-data">

                    <i class="fa-solid fa-users"></i>

                    <br>

                    No Staff Added Yet

                </td>

            </tr>

        `;

        return;

    }


    staffList.forEach(function(staff, index) {

        let row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${index + 1}</td>

            <td>
                <strong>${staff.name}</strong>
            </td>

            
            <td>${staff.mobile}</td>

            <td>${staff.email || "-"}</td>

            <td>${staff.role || "-"}</td>

            <td>

                <span class="status">

                    ${staff.status}

                </span>

            </td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteStaff(${index})">

                    <i class="fa-solid fa-trash"></i>

                    Delete

                </button>

            </td>

        `;


        tableBody.appendChild(row);

    });

}


// ========================================
// SEARCH STAFF
// ========================================

function searchStaff() {

    let search =
        document
        .getElementById("searchStaff")
        .value
        .toLowerCase();


    let rows =
        document
        .getElementById("staffTableBody")
        .getElementsByTagName("tr");


    for (let i = 0; i < rows.length; i++) {

        let text =
            rows[i].innerText.toLowerCase();


        if (text.includes(search)) {

            rows[i].style.display = "";

        } else {

            rows[i].style.display = "none";

        }

    }

}


// ========================================
// DELETE STAFF
// ========================================

function deleteStaff(index) {

    let confirmDelete =
        confirm(
            "Are you sure you want to delete this staff?"
        );


    if (!confirmDelete) {

        return;

    }


    let staffList =
        JSON.parse(
            localStorage.getItem("smartLibraryStaff")
        ) || [];


    staffList.splice(index, 1);


    localStorage.setItem(
        "smartLibraryStaff",
        JSON.stringify(staffList)
    );


    alert("Staff Deleted Successfully!");


    loadStaff();

}


// ========================================
// PAGE LOAD
// ========================================

window.addEventListener(
    "load",
    loadStaff
);

</script>

</body>

</html>
