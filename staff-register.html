<!DOCTYPE html>
<html>
<head>
    <title>Staff Registration - Smart Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-box">

    <h2>Staff Registration</h2>

    <input type="text" id="staffName" placeholder="Staff Name">

    <input type="text" id="staffUsername" placeholder="Username">

    <input type="password" id="staffPassword" placeholder="Password">

    <input type="text" id="staffMobile" placeholder="Mobile Number">

    <button onclick="saveStaff()">Save Staff</button>

</div>

<script src="script.js"></script>

</body>
</html>
